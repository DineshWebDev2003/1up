workflows:
  android_universal_release:
    name: "Android Universal Release Optimized"
    max_build_duration: 60

    environment:
      node: 20
      java: 17
      vars:
        PACKAGE_NAME: $PACKAGE_NAME
        ANDROID_KEYSTORE: $ANDROID_KEYSTORE
        ANDROID_KEYSTORE_PASSWORD: $ANDROID_KEYSTORE_PASSWORD
        ANDROID_KEY_ALIAS: $ANDROID_KEY_ALIAS
        ANDROID_KEY_PASSWORD: $ANDROID_KEY_PASSWORD
        BUILD_EMAIL: $BUILD_EMAIL

    scripts:
      - name: Install Dependencies
        script: |
          npm install --legacy-peer-deps
          npm prune  # remove unused packages

      - name: Optimize Assets (Reduce App Size)
        script: |
          npx expo-optimize

      - name: Expo Prebuild (Clean)
        script: |
          npx expo prebuild --platform android --non-interactive --clean

      - name: Enable Universal APK (All Devices Support)
        script: |
          cd android/app
          sed -i "s/enableSeparateBuildPerCPUArchitecture true/enableSeparateBuildPerCPUArchitecture false/g" build.gradle

      - name: Enable Proguard & Resource Shrinking
        script: |
          cd android/app
          sed -i 's/minifyEnabled false/minifyEnabled true/g' build.gradle
          sed -i 's/shrinkResources false/shrinkResources true/g' build.gradle

      - name: Build Universal Signed APK
        script: |
          cd $CM_BUILD_DIR/android
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon

    artifacts:
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - "$BUILD_EMAIL"