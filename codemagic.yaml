workflows:
  android_universal_release:
    name: "Android Universal Release (Optimized)"
    max_build_duration: 60

    environment:
      node: 20
      java: 17
      vars:
        APP_DIR: .

    cache:
      cache_paths:
        - ~/.npm
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - $APP_DIR/node_modules
        - $APP_DIR/android/.gradle

    scripts:
      - name: "Show versions"
        script: |
          echo "Node $(node -v)"
          echo "NPM  $(npm -v)"
          java -version || true

      - name: "Install dependencies"
        script: |
          cd "$APP_DIR"
          npm ci

      - name: "Expo Prebuild"
        script: |
          cd "$APP_DIR"
          npx expo prebuild -p android --non-interactive

      - name: "Enable Universal APK (supports all devices)"
        script: |
          cd android/app
          sed -i '' "s/enableSeparateBuildPerCPUArchitecture true/enableSeparateBuildPerCPUArchitecture false/g" build.gradle

      - name: "Optimize APK (Reduce Size 30–50%)"
        script: |
          cd android/app

          echo "🔧 Enabling Proguard & Resource Shrinking"
          sed -i '' "s/minifyEnabled false/minifyEnabled true/g" build.gradle
          sed -i '' "s/shrinkResources false/shrinkResources true/g" build.gradle

          echo "🔧 Removing x86 and unused architectures"
          find . -name '*x86*' -delete || true
          find . -name '*armeabi*' -delete || true

          echo "🔧 Disabling debug symbols"
          echo "
          android {
            packagingOptions {
              jniDebuggable false
              doNotStrip '**/*.so'
            }
          }
          " >> build.gradle

          echo "🔧 Compressing assets"
          cd "$APP_DIR"
          npx expo-optimize --quality 80 || true

      - name: "Configure Android Keystore"
        script: |
          cd "$APP_DIR/android"
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > release-keystore.jks
            echo "MYAPP_UPLOAD_STORE_FILE=release-keystore.jks" >> gradle.properties
            echo "MYAPP_UPLOAD_KEY_ALIAS=$CM_KEY_ALIAS" >> gradle.properties
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD" >> gradle.properties
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$CM_KEY_PASSWORD" >> gradle.properties
          fi

      - name: "Build Universal APK"
        script: |
          cd "$APP_DIR/android"
          ./gradlew clean assembleRelease --no-daemon

      - name: "Show APK Size"
        script: |
          FILE=$(find "$APP_DIR/android/app/build/outputs" -type f -name "*.apk" | head -n 1)
          SIZE=$(du -m "$FILE" | cut -f1)
          echo "📦 FINAL APK SIZE: ${SIZE} MB"

    artifacts:
      - "$APP_DIR/android/app/build/outputs/**/*.apk"

    publishing:
      email:
        recipients:
          - dev-team@tnhappykids.in
        notify:
          success: true
          failure: true