workflows:
  android_universal_release:
    name: Android Universal Release (Expo) - Small APK + All Devices Support
    max_build_duration: 60

    environment:
      node: 20
      java: 17
      vars:
        APP_DIR: .

    cache:
      cache_paths:
        - ~/.npm
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - $APP_DIR/node_modules
        - $APP_DIR/android/.gradle

    scripts:
      - name: Show versions
        script: |
          echo "Node $(node -v)"
          echo "NPM  $(npm -v)"
          java -version || true

      - name: Install dependencies
        script: |
          cd "$APP_DIR"
          npm ci

      - name: Expo Prebuild Android
        script: |
          cd "$APP_DIR"
          npx expo prebuild -p android --non-interactive

      - name: Fix: Enable Universal APK Support
        script: |
          cd android/app
          sed -i '' "s/enableSeparateBuildPerCPUArchitecture true/enableSeparateBuildPerCPUArchitecture false/g" build.gradle

      - name: Optimize App: Enable Proguard + Resource Shrinking
        script: |
          cd android/app
          sed -i '' "s/minifyEnabled false/minifyEnabled true/g" build.gradle
          sed -i '' "s/shrinkResources false/shrinkResources true/g" build.gradle

      - name: Remove Unused Node Modules (Reduce APK Size)
        script: |
          cd "$APP_DIR"
          npx react-native-clean-project clean-project-auto

      - name: Configure Android Keystore
        script: |
          cd "$APP_DIR/android"
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > release-keystore.jks
            echo "MYAPP_UPLOAD_STORE_FILE=release-keystore.jks" >> gradle.properties
            echo "MYAPP_UPLOAD_KEY_ALIAS=$CM_KEY_ALIAS" >> gradle.properties
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD" >> gradle.properties
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$CM_KEY_PASSWORD" >> gradle.properties
          fi

      - name: Build Universal APK
        script: |
          cd "$APP_DIR/android"
          ./gradlew clean assembleRelease --no-daemon

      - name: Verify APK Size
        script: |
          FILE=$(find "$APP_DIR/android/app/build/outputs" -type f -name "*.apk" | head -n 1)
          SIZE=$(du -m "$FILE" | cut -f1)
          echo "APK SIZE: $SIZE MB"
          if [ "$SIZE" -gt 50 ]; then
            echo "APK too big! (>50 MB)."
            exit 1
          fi

    artifacts:
      - "$APP_DIR/android/app/build/outputs/**/*.apk"

    publishing:
      email:
        recipients:
          - dev-team@tnhappykids.in
        notify:
          success: true
          failure: true