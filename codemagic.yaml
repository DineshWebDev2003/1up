workflows:
  android_universal_release:
    name: Android Universal Release Optimized
    max_build_duration: 60

    environment:
      node: 20
      java: 17
      android: latest
      vars:
        PACKAGE_NAME: $PACKAGE_NAME
        ANDROID_KEYSTORE: $ANDROID_KEYSTORE
        ANDROID_KEYSTORE_PASSWORD: $ANDROID_KEYSTORE_PASSWORD
        ANDROID_KEY_ALIAS: $ANDROID_KEY_ALIAS
        ANDROID_KEY_PASSWORD: $ANDROID_KEY_PASSWORD
        BUILD_EMAIL: $BUILD_EMAIL

    scripts:

      - name: Install Dependencies
        script: |
          npm install --legacy-peer-deps
          # Remove unused packages automatically
          npm prune

      - name: Optimize Assets (Reduce Size)
        script: |
          npx expo-optimize

      - name: Expo Prebuild (Universal Support)
        script: |
          npx expo prebuild --platform android --non-interactive \
            --clean

      - name: Enable Universal APK (armeabi + arm64 + x86 + x86_64)
        script: |
          cd android/app
          sed -i "s/enableSeparateBuildPerCPUArchitecture true/enableSeparateBuildPerCPUArchitecture false/g" build.gradle

      - name: Enable Proguard + Resource Shrinking (Maximum Size Reduce)
        script: |
          cd android/app
          sed -i 's/minifyEnabled false/minifyEnabled true/g' build.gradle
          sed -i 's/shrinkResources false/shrinkResources true/g' build.gradle

      - name: Build Signed UNIVERSAL APK
        script: |
          cd $CM_BUILD_DIR/android
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon

    artifacts:
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - "$BUILD_EMAIL"