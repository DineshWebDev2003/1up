workflows:
  android_release:
    name: Android Release Build
    max_build_duration: 60

    environment:
      vars:
        PACKAGE_NAME: "com.yourapp"
      groups:
        - github_secrets

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Clean Android project
        script: |
          cd android
          ./gradlew clean
          cd ..

      - name: Remove unused packages (tree-shake)
        script: |
          npx react-native-clean-project --remove-iOS-build --remove-android-build || true

      - name: Optimize assets
        script: |
          npx expo-optimize || true

      - name: Enable Universal APK (all devices)
        script: |
          sed -i '' 's/enableSplits = true/enableSplits = false/g' android/app/build.gradle || true

      - name: Build Release APK
        script: |
          cd android
          ./gradlew assembleRelease
          cd ..

      - name: Verify APK size (<80MB)
        script: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_SIZE_MB=$(du -m "$APK_PATH" | cut -f1)

          echo "APK SIZE: $APK_SIZE_MB MB"

          if [ "$APK_SIZE_MB" -gt 80 ]; then
            echo "APK too big (>80 MB). Failing build."
            exit 1
          fi

    artifacts:
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - "dineshmahi02@gmail.com"
        notify:
          success: true
          failure: true